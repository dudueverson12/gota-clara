<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gota Clara</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #141311;
    --fg: #ebe6dc;
    --muted: #a39b8e;
    --line: #2c2a26;
    --btn: #221f1b;
    --btn-fg: #ebe6dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    line-height: 1.65;
  }
  header, .nav, main {
    max-width: 42rem;
    margin: 0 auto;
    padding-left: 1.15rem;
    padding-right: 1.15rem;
  }
  header {
    padding-top: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 1.45rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0.3rem 0 0;
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 0.92rem;
  }
  .nav {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    padding-top: 0.85rem;
    padding-bottom: 0.85rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    z-index: 1;
  }
  button, select {
    font-family: system-ui, sans-serif;
    font-size: 0.95rem;
    color: var(--btn-fg);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 0.4rem;
    padding: 0.55rem 0.7rem;
  }
  button { cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: 0.4; cursor: default; }
  select { flex: 1; min-width: 0; }
  main { padding-top: 1.25rem; padding-bottom: 3rem; }
  h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 1.1rem;
    line-height: 1.35;
  }
  p { margin: 0 0 0.95rem; font-size: 1.05rem; }
  p.fala { margin-left: 0; }
  strong { font-weight: 700; }
  main { padding: 0; }
  #texto { margin: 0; padding: 0; line-height: 0; }
  #texto img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    vertical-align: top;
  }
  .fim {
    display: flex;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }
  .fim button { flex: 1; }
  header, .nav, .fim, #titulo { display: none; }
</style>
</head>
<body>
<header>
  <h1>Gota Clara</h1>
  <p>páginas em sequência.</p>
</header>
<nav class="nav" aria-label="Capítulos">
  <button type="button" id="anterior">Anterior</button>
  <select id="ir" aria-label="Ir para o capítulo"></select>
  <button type="button" id="proximo">Próximo</button>
</nav>
<main>
  <h2 id="titulo"></h2>
  <article id="texto"></article>
  <div class="fim">
    <button type="button" id="anterior2">Anterior</button>
    <button type="button" id="proximo2">Próximo</button>
  </div>
</main>
<script src="chapters.js"></script>
<script>
(function () {
  var lista = window.CAPITULOS || [];
  var texto = document.getElementById("texto");
  var html = "";
  lista.forEach(function (cap) {
    if (!(cap.pages > 0)) return;
    var i;
    for (i = 1; i <= cap.pages; i++) {
      var nn = i < 10 ? "0" + i : String(i);
      html += '<img src="paginas/' + cap.n + '/page-' + nn + '.jpg" alt="">';
    }
  });
  texto.innerHTML = html;
})();
</script>
</body>
</html>
